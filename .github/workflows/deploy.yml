name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MP_PUBLIC_KEY: ${{ secrets.VITE_MP_PUBLIC_KEY }}
          VITE_PIX_KEY: ${{ secrets.VITE_PIX_KEY }}
          VITE_PIX_NAME: ${{ secrets.VITE_PIX_NAME }}
          VITE_PIX_PRICE_CHILD_0_4: ${{ secrets.VITE_PIX_PRICE_CHILD_0_4 }}
          VITE_PIX_PRICE_CHILD_11: ${{ secrets.VITE_PIX_PRICE_CHILD_11 }}
          VITE_PIX_PRICE_CHILD_4_8: ${{ secrets.VITE_PIX_PRICE_CHILD_4_8 }}
          VITE_PIX_PRICE_PER_PERSON: ${{ secrets.VITE_PIX_PRICE_PER_PERSON }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
